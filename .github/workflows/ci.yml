name: CI
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25  # v22 (node24)
      # NOTE: magic-nix-cache-action removed 2026-04-16 — DeterminateSystems
      # tied it to FlakeHub auth, which broke CI for individual maintainers
      # without a FlakeHub account. Builds without binary cache are slower
      # but reliable. To re-enable caching: register at flakehub.com OR
      # switch to cachix-action with a personal cache.

      - name: Eval check
        run: nix flake check --no-build


      - name: Format check
        run: nix fmt -- --check .

      - name: Build
        run: |
          # Skip build for module-only repos (no packages output)
          if nix eval .#packages.x86_64-linux.default --apply 'x: true' 2>/dev/null; then
            nix build --print-build-logs
          else
            echo "No default package — skipping build (module-only repo)"
          fi

      - name: Verify Mesa outputs
        run: |
          # Check for expected Mesa output structures
          echo "=== Mesa outputs ==="
          if [ -d result ]; then
            find result -maxdepth 1 -type d | sort
          elif [ -L result ]; then
            find result -maxdepth 1 -type d | sort
          fi

          errors=0

          # 1. Verify core Mesa libraries (nixpkgs naming: _mesa suffix for libglvnd)
          echo "=== Checking core libraries ==="
          for lib in libGLX_mesa libEGL_mesa libgallium; do
            found=$(find result/ -name "${lib}*" -type f 2>/dev/null | head -1)
            if [ -z "$found" ]; then
              echo "::error::Missing core library: ${lib}"
              errors=$((errors + 1))
            else
              echo "  ${lib}: $(basename "$found")"
            fi
          done

          # 2. ldd check on libGLX_mesa for missing dependencies
          echo "=== ldd check (libGLX_mesa) ==="
          GBM=$(find result/ -name 'libGLX_mesa.so*' -type f 2>/dev/null | head -1)
          if [ -n "$GBM" ]; then
            MISSING=$(ldd "$GBM" 2>&1 | grep "not found" || true)
            if [ -n "$MISSING" ]; then
              echo "::error::libGLX_mesa has missing shared library dependencies:"
              echo "$MISSING"
              errors=$((errors + 1))
            else
              echo "  All dependencies resolved"
            fi
          fi

          # 3. Check OpenCL ICD file (in separate opencl output)
          echo "=== OpenCL ICD check ==="
          if nix build .#mesa-git.opencl --no-link 2>/dev/null; then
            OPENCL_PATH=$(nix eval --raw .#mesa-git.opencl.outPath 2>/dev/null)
            ICD=$(find "$OPENCL_PATH" -name '*.icd' 2>/dev/null | head -1)
            if [ -n "$ICD" ]; then
              echo "  ICD found: $(basename "$ICD")"
              if grep -qP '^/nix/store/' "$ICD"; then
                echo "  ICD path is absolute (correct)"
              else
                echo "::warning::ICD file has no absolute store path"
              fi
            else
              echo "::warning::OpenCL output exists but no ICD file found"
            fi
          else
            echo "::warning::OpenCL output not built"
          fi

          # 4. Check driver output contains DRI drivers
          echo "=== DRI driver check ==="
          DRI_COUNT=$(find result/ -name '*_dri.so' 2>/dev/null | wc -l)
          if [ "$DRI_COUNT" -gt 0 ]; then
            echo "  ${DRI_COUNT} DRI driver(s) found"
          else
            echo "::warning::No DRI drivers found (check driver configuration)"
          fi

          # 5. Check Vulkan drivers exist
          echo "=== Vulkan driver check ==="
          VK_COUNT=$(find result/ -name 'libvulkan_*.so' 2>/dev/null | wc -l)
          if [ "$VK_COUNT" -gt 0 ]; then
            echo "  ${VK_COUNT} Vulkan driver(s) found"
          else
            echo "::warning::No Vulkan drivers found"
          fi

          [ "$errors" -eq 0 ] || { echo "::error::${errors} verification failure(s)"; exit 1; }
          echo "=== Verification passed ==="